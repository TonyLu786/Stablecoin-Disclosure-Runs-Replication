name: replication

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Public release audit
        run: python scripts/check_public_release.py
      - name: README integrity audit
        run: python scripts/check_readme_integrity.py
      - name: Smoke replication
        run: python scripts/run_public_replication.py --mode smoke
